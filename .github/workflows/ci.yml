name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger: the ZAP baseline scan is on demand (it boots the whole
  # stack and needs an already-built image), not on every push.
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  UV_VERSION: "0.12.10"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Run Ruff format check
        run: uv run ruff format --check src/ tests/ scripts/

      - name: Run Ruff lint
        run: uv run ruff check src/ tests/ scripts/

      - name: Run Ruff style (non-gating)
        run: uv run ruff check src/ tests/ scripts/ --preview --select PL,TRY,ARG,PERF,FLY,PD,PGH,TID,LOG,T20,PIE,NPY,C90,TCH || true
        continue-on-error: true

      - name: Run mypy type check
        run: uv run mypy src/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Run unit tests
        run: uv run pytest tests/unit -v --cov=src/authzlab --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  coverage:
    name: Coverage Floor
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: authzlab
          POSTGRES_USER: authzlab
          POSTGRES_PASSWORD: authzlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U authzlab -d authzlab"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U authzlab; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL not ready after 60s"
          exit 1

      - name: Initialize database
        run: uv run python -c "from authzlab.infrastructure.database import init_db; init_db()"
        env:
          DATABASE_URL: postgresql+psycopg://authzlab:authzlab@localhost:5432/authzlab

      # M-1: unit coverage alone understates the real number, so the floor is
      # enforced against the whole suite (integration + security need Postgres).
      # 78 == measured ~80.4% minus ~2 points of headroom; keep in sync with
      # COVERAGE_MIN in the Makefile and CONTRIBUTING.md.
      - name: Run full suite with coverage floor
        run: >-
          uv run pytest tests/ -v
          --cov=src/authzlab
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=78
        env:
          DATABASE_URL: postgresql+psycopg://authzlab:authzlab@localhost:5432/authzlab

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: authzlab
          POSTGRES_USER: authzlab
          POSTGRES_PASSWORD: authzlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U authzlab -d authzlab"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U authzlab; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL not ready after 60s"
          exit 1

      - name: Initialize database
        run: uv run python -c "from authzlab.infrastructure.database import init_db; init_db()"
        env:
          DATABASE_URL: postgresql+psycopg://authzlab:authzlab@localhost:5432/authzlab

      - name: Run integration tests
        run: uv run pytest tests/integration -v
        env:
          DATABASE_URL: postgresql+psycopg://authzlab:authzlab@localhost:5432/authzlab

  security-tests:
    name: Security Regression Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: authzlab
          POSTGRES_USER: authzlab
          POSTGRES_PASSWORD: authzlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U authzlab -d authzlab"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U authzlab; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Initialize database
        run: uv run python -c "from authzlab.infrastructure.database import init_db; init_db()"
        env:
          DATABASE_URL: postgresql+psycopg://authzlab:authzlab@localhost:5432/authzlab

      - name: Seed demo data
        run: uv run python scripts/seed_demo.py
        env:
          DATABASE_URL: postgresql+psycopg://authzlab:authzlab@localhost:5432/authzlab

      - name: Run security regression tests
        run: uv run pytest tests/security -v
        env:
          DATABASE_URL: postgresql+psycopg://authzlab:authzlab@localhost:5432/authzlab

  security-scans:
    name: Security Scans
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Run Semgrep SAST
        run: uv run semgrep scan --config=p/python --config=p/secrets --sarif --sarif-output=semgrep-results.sarif src/

      - name: Upload Semgrep results
        uses: github/codeql-action/upload-sarif@v3
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - name: Install Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          # L-1: `uv sync` creates .venv and .git is huge; both make trivy
          # time out. Mirrors the `trivy` Makefile target.
          skip-dirs: '.venv,.git'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, integration-tests, security-tests, coverage]
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: authzlab
          POSTGRES_USER: authzlab
          POSTGRES_PASSWORD: authzlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U authzlab -d authzlab"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build secure image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: runtime
          tags: authzlab:secure
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test secure image
        run: |
          docker run --rm -d --name authzlab-test \
            -e HOST=0.0.0.0 \
            -e DATABASE_URL=postgresql+psycopg://authzlab:authzlab@host.docker.internal:5432/authzlab \
            -p 8000:8000 \
            authzlab:secure
          sleep 10
          curl -f http://localhost:8000/health/live
          curl -f http://localhost:8000/health/ready
          docker stop authzlab-test

  zap-scan:
    name: OWASP ZAP Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: docker-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start secure stack
        run: docker compose --profile secure up -d

      - name: Wait for services
        run: |
          sleep 15
          curl -f http://localhost:8000/health/ready

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://host.docker.internal:8000'
          fail_action: false

      - name: Stop services
        run: docker compose --profile secure down

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, integration-tests, security-tests, coverage, security-scans, docker-build]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "All required jobs completed"
          echo "Lint & Typecheck: ${{ needs.lint-and-typecheck.result }}"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Security Tests: ${{ needs.security-tests.result }}"
          echo "Coverage Floor: ${{ needs.coverage.result }}"
          echo "Security Scans: ${{ needs.security-scans.result }}"
          echo "Docker Build: ${{ needs.docker-build.result }}"
